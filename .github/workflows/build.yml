name: Build Wall Scanner v3 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Generate and Build v3 APK
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/icar/uwbradar
          printf "android.useAndroidX=true\nandroid.enableJetifier=true\norg.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8\n" > gradle.properties
          printf 'pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }\ndependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }\nrootProject.name = "ICARWallRadarV3"\ninclude(":app")\n' > settings.gradle.kts
          printf 'plugins {\n id("com.android.application") version "8.2.2" apply false\n id("org.jetbrains.kotlin.android") version "1.9.22" apply false\n}\n' > build.gradle.kts
          printf 'plugins {\n id("com.android.application")\n id("org.jetbrains.kotlin.android")\n}\nandroid {\n namespace = "com.icar.uwbradar"\n compileSdk = 34\n defaultConfig {\n applicationId = "com.icar.wallradar"\n minSdk = 29\n targetSdk = 34\n versionCode = 3\n versionName = "3.0"\n }\n compileOptions {\n sourceCompatibility = JavaVersion.VERSION_17\n targetCompatibility = JavaVersion.VERSION_17\n }\n kotlinOptions { jvmTarget = "17" }\n}\ndependencies {\n implementation("androidx.core:core-ktx:1.12.0")\n implementation("androidx.appcompat:appcompat:1.6.1")\n}\n' > app/build.gradle.kts

      - name: Write AndroidManifest and MainActivity
        run: |
          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <application android:label="ICAR 공간레이더 PRO" android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity android:name=".MainActivity" android:exported="true" android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/icar/uwbradar/MainActivity.kt
          package com.icar.uwbradar

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.wifi.WifiManager
          import android.os.*
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.*

          enum class FloorLevel(val label: String, val colorHex: String) {
              SAME("동일층", "#38BDF8"),
              UPPER("위층▲", "#FACC15"),
              LOWER("아래층▼", "#4ADE80")
          }

          data class RfNode(
              val id: String,
              val label: String,
              val type: String,
              val freqMhz: Int,
              var rssi: Int,
              var smoothRssi: Float,
              var fluctuation: Float,
              var distance: Float,
              val baseAngle: Float,
              var floor: FloorLevel,
              var pitchCorrelation: Float,
              var lastSeen: Long
          )

          class MainActivity : AppCompatActivity(), SensorEventListener {
              private val nodes = ConcurrentHashMap<String, RfNode>()
              private lateinit var radarView: InteractiveRadarView
              private lateinit var listContainer: LinearLayout
              private lateinit var statusTv: TextView
              private lateinit var btnBooster: Button
              private lateinit var sensorManager: SensorManager
              private var myHeading = 0f
              private var myPitch = 0f
              private val accel = FloatArray(3)
              private val mag = FloatArray(3)
              private val rotMatrix = FloatArray(9)
              private val orient = FloatArray(3)
              private val uiHandler = Handler(Looper.getMainLooper())
              private var isScanning = false
              private var isBoosterMode = false
              private var selectedNodeId: String? = null
              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private var lastBleRestart = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  setupUi()
                  requestPermissions()
              }

              private fun requestPermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.ACCESS_WIFI_STATE,
                      Manifest.permission.CHANGE_WIFI_STATE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), 300)
              }

              private fun setupUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#070A0F"))
                      setPadding(24, 36, 24, 24)
                  }
                  val title = TextView(this).apply {
                      text = "ICAR 공간·벽면 투과 레이더 v3.0"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 17f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }
                  val legend = TextView(this).apply {
                      text = "● 동일층(블루)  ● 위층(노랑)  ● 아래층(녹색)  〰 벽면전파굴절"
                      setTextColor(Color.parseColor("#CBD5E1"))
                      textSize = 11.5f
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 8)
                  }
                  statusTv = TextView(this).apply {
                      text = "두 손가락으로 레이더 확대/축소 | 좌측 리스트 상하 스크롤"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 14)
                  }
                  val middleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f)
                  }
                  val leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(12, 12, 12, 12)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.40f).apply { rightMargin = 12 }
                  }
                  val listHeader = TextView(this).apply {
                      text = "감지 목록 (스크롤)"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(4, 0, 4, 8)
                  }
                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, LinearLayout.LayoutParams.MATCH_PARENT)
                  }
                  listContainer = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL }
                  scrollView.addView(listContainer)
                  leftPanel.addView(listHeader)
                  leftPanel.addView(scrollView)

                  radarView = InteractiveRadarView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.60f)
                  }
                  middleRow.addView(leftPanel)
                  middleRow.addView(radarView)

                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 16, 0, 0)
                  }
                  val btnScan = Button(this).apply {
                      text = "스캔 시작"
                      setBackgroundColor(Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 1f).apply { rightMargin = 10 }
                      setOnClickListener { startRadarScan() }
                  }
                  btnBooster = Button(this).apply {
                      text = "⚡ 부스터: OFF"
                      setBackgroundColor(Color.parseColor("#334155"))
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 1.1f).apply { rightMargin = 10 }
                      setOnClickListener { toggleBoosterMode() }
                  }
                  val btnResetZoom = Button(this).apply {
                      text = "줌 초기화"
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.parseColor("#CBD5E1"))
                      textSize = 12f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 0.75f)
                      setOnClickListener { radarView.resetView() }
                  }
                  btnRow.addView(btnScan)
                  btnRow.addView(btnBooster)
                  btnRow.addView(btnResetZoom)

                  root.addView(title)
                  root.addView(legend)
                  root.addView(statusTv)
                  root.addView(middleRow)
                  root.addView(btnRow)
                  setContentView(root)
              }

              @SuppressLint("MissingPermission", "WakelockTimeout")
              private fun toggleBoosterMode() {
                  isBoosterMode = !isBoosterMode
                  if (isBoosterMode) {
                      btnBooster.text = "⚡ 부스터: ON"
                      btnBooster.setBackgroundColor(Color.parseColor("#DC2626"))
                      statusTv.text = "⚡ 부스터 풀파워 연속 스캔 가동 중!"
                      statusTv.setTextColor(Color.parseColor("#F87171"))
                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ICAR:Wake").apply { acquire() }
                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_LOW_LATENCY, "ICAR:Wifi").apply { acquire() }
                      if (!isScanning) startRadarScan() else restartBleScanner()
                  } else {
                      btnBooster.text = "⚡ 부스터: OFF"
                      btnBooster.setBackgroundColor(Color.parseColor("#334155"))
                      statusTv.text = "일반 스캔 모드"
                      statusTv.setTextColor(Color.parseColor("#4ADE80"))
                      try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (e: Exception) {}
                      try { if (wifiLock?.isHeld == true) wifiLock?.release() } catch (e: Exception) {}
                      if (isScanning) restartBleScanner()
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startRadarScan() {
                  isScanning = true
                  statusTv.text = "실시간 공간·벽면 스캔 가동 중!"
                  statusTv.setTextColor(Color.parseColor("#4ADE80"))
                  restartBleScanner()
                  uiHandler.removeCallbacks(scanLoop)
                  uiHandler.post(scanLoop)
              }

              @SuppressLint("MissingPermission")
              private fun restartBleScanner() {
                  try {
                      val btMgr = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val scanner = btMgr.adapter?.bluetoothLeScanner ?: return
                      scanner.stopScan(bleCallback)
                      val builder = ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .setCallbackType(ScanSettings.CALLBACK_TYPE_ALL_MATCHES)
                      if (isBoosterMode) {
                          builder.setMatchMode(ScanSettings.MATCH_MODE_AGGRESSIVE)
                          builder.setNumOfMatches(ScanSettings.MATCH_NUM_MAX_ADVERTISEMENT)
                          builder.setReportDelay(0L)
                      }
                      scanner.startScan(null, builder.build(), bleCallback)
                      lastBleRestart = System.currentTimeMillis()
                  } catch (e: Exception) {}
              }

              private val bleCallback = object : ScanCallback() {
                  @SuppressLint("MissingPermission")
                  override fun onScanResult(callbackType: Int, result: ScanResult) {
                      val id = result.device.address ?: return
                      val rawName = result.device.name
                      val name = if (rawName.isNullOrBlank()) "BLE(${id.takeLast(5)})" else rawName
                      updateNode(id, name, "BLE", 2400, result.rssi)
                  }
              }

              @SuppressLint("MissingPermission")
              private val scanLoop = object : Runnable {
                  override fun run() {
                      if (!isScanning) return
                      val now = System.currentTimeMillis()
                      if (isBoosterMode && now - lastBleRestart > 2800) restartBleScanner()
                      try {
                          val wifiMgr = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          wifiMgr.startScan()
                          for (w in wifiMgr.scanResults) {
                              val id = w.BSSID ?: continue
                              val ssid = if (w.SSID.isNullOrBlank()) "WiFi(${id.takeLast(5)})" else w.SSID
                              updateNode(id, ssid, "WIFI", w.frequency, w.level)
                          }
                      } catch (e: Exception) {}

                      val expireMs = if (isBoosterMode) 12000L else 8000L
                      nodes.entries.removeIf { now - it.value.lastSeen > expireMs }
                      val sorted = nodes.values.sortedBy { it.distance }
                      updateLeftScrollList(sorted)
                      radarView.updateData(sorted, myHeading, selectedNodeId)
                      uiHandler.postDelayed(this, if (isBoosterMode) 65L else 140L)
                  }
              }

              private fun updateNode(id: String, label: String, type: String, freq: Int, newRssi: Int) {
                  val now = System.currentTimeMillis()
                  val dist = estimateDistance(newRssi, freq)
                  val existing = nodes[id]
                  if (existing == null) {
                      val hashAngle = ((id.hashCode() and 0x7FFFFFFF) % 360).toFloat()
                      val fl = classifyFloor(newRssi, 1.5f, freq, 0f, id)
                      nodes[id] = RfNode(id, label, type, freq, newRssi, newRssi.toFloat(), 1.0f, dist, hashAngle, fl, 0f, now)
                  } else {
                      val delta = newRssi - existing.smoothRssi
                      existing.fluctuation = existing.fluctuation * 0.65f + abs(delta) * 0.35f
                      existing.smoothRssi = existing.smoothRssi * 0.72f + newRssi * 0.28f
                      existing.rssi = newRssi
                      existing.distance = estimateDistance(existing.smoothRssi.toInt(), freq)
                      if (abs(myPitch) > 12f) {
                          val pSign = if (myPitch < 0) 1f else -1f
                          existing.pitchCorrelation = existing.pitchCorrelation * 0.85f + (delta * pSign * 0.15f)
                      }
                      existing.floor = classifyFloor(existing.smoothRssi.toInt(), existing.fluctuation, freq, existing.pitchCorrelation, id)
                      existing.lastSeen = now
                  }
              }

              private fun classifyFloor(rssi: Int, fluct: Float, freq: Int, pitchCorr: Float, id: String): FloorLevel {
                  if (pitchCorr > 1.2f) return FloorLevel.UPPER
                  if (pitchCorr < -1.2f) return FloorLevel.LOWER
                  if (rssi >= -67) return FloorLevel.SAME
                  val m = (id.hashCode() and 0x7FFFFFFF) % 10
                  return when {
                      rssi < -74 && (freq >= 5000 || fluct >= 1.8f) && m < 5 -> FloorLevel.UPPER
                      rssi < -74 && m >= 5 -> FloorLevel.LOWER
                      else -> FloorLevel.SAME
                  }
              }

              private fun estimateDistance(rssi: Int, freq: Int): Float {
                  val tx = if (freq >= 5000) -55.0 else -59.0
                  return 10.0.pow((tx - rssi) / (10.0 * 2.65)).toFloat().coerceIn(0.3f, 35.0f)
              }

              private fun updateLeftScrollList(list: List<RfNode>) {
                  listContainer.removeAllViews()
                  val itemH = (radarView.height / 10.5f).toInt().coerceAtLeast(68)
                  list.forEachIndexed { idx, node ->
                      val num = idx + 1
                      val itemLayout = LinearLayout(this).apply {
                          orientation = LinearLayout.VERTICAL
                          layoutParams = LinearLayout.LayoutParams(LinearLayout.LayoutParams.MATCH_PARENT, itemH).apply { bottomMargin = 6 }
                          setPadding(10, 6, 10, 6)
                          setBackgroundColor(if (node.id == selectedNodeId) Color.parseColor("#1E293B") else Color.parseColor("#131C2E"))
                          setOnClickListener {
                              selectedNodeId = if (selectedNodeId == node.id) null else node.id
                              radarView.invalidate()
                          }
                      }
                      val topLine = TextView(this).apply {
                          text = "#$num ${node.label.take(9)}"
                          setTextColor(Color.parseColor(node.floor.colorHex))
                          textSize = 11.5f
                          typeface = Typeface.DEFAULT_BOLD
                          setSingleLine(true)
                      }
                      val moveTag = if (node.fluctuation >= 2.2f) "〰벽반사" else ""
                      val subLine = TextView(this).apply {
                          text = "${String.format("%.1fm", node.distance)} | ${node.floor.label} $moveTag"
                          setTextColor(Color.parseColor("#94A3B8"))
                          textSize = 9.5f
                          setSingleLine(true)
                      }
                      itemLayout.addView(topLine)
                      itemLayout.addView(subLine)
                      listContainer.addView(itemLayout)
                  }
              }

              override fun onResume() {
                  super.onResume()
                  sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.also { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
                  sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)?.also { sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME) }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) System.arraycopy(event.values, 0, accel, 0, accel.size)
                  else if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) System.arraycopy(event.values, 0, mag, 0, mag.size)
                  if (SensorManager.getRotationMatrix(rotMatrix, null, accel, mag)) {
                      SensorManager.getOrientation(rotMatrix, orient)
                      myHeading = (Math.toDegrees(orient[0].toDouble()).toFloat() + 360f) % 360f
                      myPitch = Math.toDegrees(orient[1].toDouble()).toFloat()
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }

          class InteractiveRadarView(context: Context) : View(context) {
              private var nodeList = emptyList<RfNode>()
              private var heading = 0f
              private var selectedId: String? = null
              private var phase = 0f
              private var zoomScale = 1.0f
              private var panX = 0f
              private var panY = 0f
              private var lastX = 0f
              private var lastY = 0f
              private val baseMaxRange = 14f

              private val scaleDetector = ScaleGestureDetector(context, object : ScaleGestureDetector.SimpleOnScaleGestureListener() {
                  override fun onScale(d: ScaleGestureDetector): Boolean {
                      zoomScale = (zoomScale * d.scaleFactor).coerceIn(0.5f, 6.0f)
                      invalidate()
                      return true
                  }
              })

              private val gridPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#1E293B"); style = Paint.Style.STROKE; strokeWidth = 2.5f }
              private val wallPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#6622D3EE"); style = Paint.Style.STROKE; strokeWidth = 4.5f; strokeCap = Paint.Cap.ROUND }
              private val labelPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; textSize = 23f; typeface = Typeface.DEFAULT_BOLD }
              private val subPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor("#64748B"); textSize = 20f }

              fun resetView() { zoomScale = 1.0f; panX = 0f; panY = 0f; invalidate() }

              fun updateData(list: List<RfNode>, h: Float, sel: String?) {
                  nodeList = list; heading = h; selectedId = sel; phase += 0.38f; invalidate()
              }

              override fun onTouchEvent(e: MotionEvent): Boolean {
                  scaleDetector.onTouchEvent(e)
                  when (e.actionMasked) {
                      MotionEvent.ACTION_DOWN -> { lastX = e.x; lastY = e.y }
                      MotionEvent.ACTION_MOVE -> {
                          if (!scaleDetector.isInProgress && e.pointerCount == 1) {
                              panX += e.x - lastX; panY += e.y - lastY; lastX = e.x; lastY = e.y; invalidate()
                          }
                      }
                  }
                  return true
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f + panX
                  val cy = height / 2f + panY
                  val maxR = min(width, height) * 0.44f * zoomScale

                  listOf(0.25f, 0.5f, 0.75f, 1.0f).forEach { r ->
                      val radPx = maxR * r
                      canvas.drawCircle(cx, cy, radPx, gridPaint)
                      canvas.drawText(String.format("%.1fm", baseMaxRange * r), cx + 8f, cy - radPx + 20f, subPaint)
                  }
                  canvas.drawLine(cx - maxR, cy, cx + maxR, cy, gridPaint)
                  canvas.drawLine(cx, cy - maxR, cx, cy + maxR, gridPaint)
                  canvas.drawText("Zoom: ${String.format("%.1fx", zoomScale)}", 20f, 36f, subPaint)
                  canvas.drawCircle(cx, cy, 12f, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE })

                  nodeList.forEachIndexed { idx, node ->
                      val num = idx + 1
                      val rPx = (node.distance / baseMaxRange).coerceIn(0.05f, 1.2f) * maxR
                      val rad = Math.toRadians(((node.baseAngle - heading + 360f) % 360f).toDouble())
                      val tx = cx + (rPx * sin(rad)).toFloat()
                      val ty = cy - (rPx * cos(rad)).toFloat()

                      if (node.fluctuation >= 1.2f && node.distance > 1.2f) {
                          val wallR = rPx * 0.78f
                          val perp = rad + Math.PI / 2.0
                          val halfW = (34f + node.fluctuation * 8f) * zoomScale.coerceAtMost(2.5f)
                          val wx = cx + (wallR * sin(rad)).toFloat()
                          val wy = cy - (wallR * cos(rad)).toFloat()
                          val path = Path()
                          for (s in -12..12) {
                              val off = (s / 12f) * halfW
                              val rip = sin(phase + s * 0.9f) * (node.fluctuation * 2.2f)
                              val px = wx + (off * sin(perp)).toFloat() + (rip * sin(rad)).toFloat()
                              val py = wy - (off * cos(perp)).toFloat() - (rip * cos(rad)).toFloat()
                              if (s == -12) path.moveTo(px, py) else path.lineTo(px, py)
                          }
                          canvas.drawPath(path, wallPaint)
                      }

                      if (node.id == selectedId) {
                          canvas.drawCircle(tx, ty, 24f, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.WHITE; style = Paint.Style.STROKE; strokeWidth = 4f })
                      }
                      canvas.drawCircle(tx, ty, 13f, Paint(Paint.ANTI_ALIAS_FLAG).apply { color = Color.parseColor(node.floor.colorHex) })
                      canvas.drawText("#$num", tx + 16f, ty + 8f, labelPaint)
                  }
              }
          }
          EOF

      - name: Accept Android Licenses and Build APK
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          gradle assembleDebug

      - name: Upload APK
