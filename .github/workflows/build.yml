name: Build Wall Scanner v3 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate v3 Project Structure
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/icar/uwbradar

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ICARWallRadarV3"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.icar.uwbradar"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.icar.wallradar"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 3
                  versionName = "3.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />

              <application
                  android:label="ICAR 공간레이더 PRO"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/icar/uwbradar/MainActivity.kt
          package com.icar.uwbradar

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.wifi.WifiManager
          import android.os.*
          import android.view.*
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.*

          // 층 구분 열거형: 같은층(BLUE), 위층(YELLOW), 아래층(GREEN)
          enum class FloorLevel(val label: String, val colorHex: String) {
              SAME("동일층", "#38BDF8"),   // 블루
              UPPER("위층▲", "#FACC15"),   // 노란색
              LOWER("아래층▼", "#4ADE80")  // 녹색
          }

          data class RfNode(
              val id: String,
              val label: String,
              val type: String,
              val freqMhz: Int,
              var rssi: Int,
              var smoothRssi: Float,
              var fluctuation: Float,
              var distance: Float,
              val baseAngle: Float,
              var floor: FloorLevel,
              var pitchCorrelation: Float,
              var lastSeen: Long
          )

          class MainActivity : AppCompatActivity(), SensorEventListener {

              private val nodes = ConcurrentHashMap<String, RfNode>()
              private lateinit var radarView: InteractiveRadarView
              private lateinit var listContainer: LinearLayout
              private lateinit var statusTv: TextView
              private lateinit var btnBooster: Button

              private lateinit var sensorManager: SensorManager
              private var myHeading = 0f
              private var myPitch = 0f // 폰 위아래 기울기 (층 감지 보정용)
              private val accel = FloatArray(3)
              private val mag = FloatArray(3)
              private val rotMatrix = FloatArray(9)
              private val orient = FloatArray(3)

              private val uiHandler = Handler(Looper.getMainLooper())
              private var isScanning = false
              private var isBoosterMode = false
              private var selectedNodeId: String? = null

              private var wakeLock: PowerManager.WakeLock? = null
              private var wifiLock: WifiManager.WifiLock? = null
              private var lastBleRestart = 0L

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  window.addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON)
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  setupUi()
                  requestPermissions()
              }

              private fun requestPermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.ACCESS_WIFI_STATE,
                      Manifest.permission.CHANGE_WIFI_STATE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), 300)
              }

              private fun setupUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#070A0F"))
                      setPadding(24, 36, 24, 24)
                  }

                  // 상단 타이틀 & 범례
                  val title = TextView(this).apply {
                      text = "ICAR 공간·벽면 투과 레이더 v3.0"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 17f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  val legend = TextView(this).apply {
                      text = "● 동일층(블루)  ● 위층(노랑)  ● 아래층(녹색)  〰 벽면전파굴절"
                      setTextColor(Color.parseColor("#CBD5E1"))
                      textSize = 11.5f
                      gravity = Gravity.CENTER
                      setPadding(0, 6, 0, 8)
                  }

                  statusTv = TextView(this).apply {
                      text = "두 손가락으로 레이더 확대/축소 가능 | 좌측 리스트 상하 스크롤"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 11f
                      gravity = Gravity.CENTER
                      setPadding(0, 0, 0, 14)
                  }

                  // 중단 메인 영역: [좌측 10개 단위 스크롤 리스트 (38%)] + [우측 멀티터치 레이더 (62%)]
                  val middleRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  }

                  // 좌측 리스트 패널
                  val leftPanel = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#0F172A"))
                      setPadding(12, 12, 12, 12)
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.40f).apply {
                          rightMargin = 12
                      }
                  }

                  val listHeader = TextView(this).apply {
                      text = "감지 목록 (스크롤)"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 12f
                      typeface = Typeface.DEFAULT_BOLD
                      setPadding(4, 0, 4, 8)
                  }

                  val scrollView = ScrollView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.MATCH_PARENT
                      )
                      isVerticalScrollBarEnabled = true
                  }

                  listContainer = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                  }
                  scrollView.addView(listContainer)
                  leftPanel.addView(listHeader)
                  leftPanel.addView(scrollView)

                  // 우측 멀티터치 줌 레이더 뷰
                  radarView = InteractiveRadarView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(0, LinearLayout.LayoutParams.MATCH_PARENT, 0.60f)
                  }

                  middleRow.addView(leftPanel)
                  middleRow.addView(radarView)

                  // 하단 컨트롤 버튼 바
                  val btnRow = LinearLayout(this).apply {
                      orientation = LinearLayout.HORIZONTAL
                      setPadding(0, 16, 0, 0)
                  }

                  val btnScan = Button(this).apply {
                      text = "스캔 시작"
                      setBackgroundColor(Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 1f).apply { rightMargin = 10 }
                      setOnClickListener { startRadarScan() }
                  }

                  btnBooster = Button(this).apply {
                      text = "⚡ 부스터: OFF"
                      setBackgroundColor(Color.parseColor("#334155"))
                      setTextColor(Color.WHITE)
                      textSize = 13f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 1.1f).apply { rightMargin = 10 }
                      setOnClickListener { toggleBoosterMode() }
                  }

                  val btnResetZoom = Button(this).apply {
                      text = "줌 초기화"
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.parseColor("#CBD5E1"))
                      textSize = 12f
                      layoutParams = LinearLayout.LayoutParams(0, 125, 0.75f)
                      setOnClickListener { radarView.resetView() }
                  }

                  btnRow.addView(btnScan)
                  btnRow.addView(btnBooster)
                  btnRow.addView(btnResetZoom)

                  root.addView(title)
                  root.addView(legend)
                  root.addView(statusTv)
                  root.addView(middleRow)
                  root.addView(btnRow)

                  setContentView(root)
              }

              @SuppressLint("MissingPermission", "WakelockTimeout")
              private fun toggleBoosterMode() {
                  isBoosterMode = !isBoosterMode
                  if (isBoosterMode) {
                      btnBooster.text = "⚡ 부스터: ON (최대출력)"
                      btnBooster.setBackgroundColor(Color.parseColor("#DC2626"))
                      statusTv.text = "⚡ 부스터 가동! 하드웨어 절전 해제 및 초고빈도 연속 전파 스캔 중"
                      statusTv.setTextColor(Color.parseColor("#F87171"))

                      val pm = getSystemService(Context.POWER_SERVICE) as PowerManager
                      wakeLock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "ICAR:BoosterWakeLock").apply { acquire() }

                      val wm = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                      wifiLock = wm.createWifiLock(WifiManager.WIFI_MODE_FULL_LOW_LATENCY, "ICAR:BoosterWifiLock").apply { acquire() }

                      if (!isScanning) startRadarScan() else restartBleScanner()
                  } else {
                      btnBooster.text = "⚡ 부스터: OFF"
                      btnBooster.setBackgroundColor(Color.parseColor("#334155"))
                      statusTv.text = "일반 스캔 모드로 전환됨"
                      statusTv.setTextColor(Color.parseColor("#4ADE80"))

                      try { if (wakeLock?.isHeld == true) wakeLock?.release() } catch (e: Exception) {}
                      try { if (wifiLock?.isHeld == true) wifiLock?.release() } catch (e: Exception) {}
                      if (isScanning) restartBleScanner()
                  }
              }

              @SuppressLint("MissingPermission")
              private fun startRadarScan() {
                  isScanning = true
                  statusTv.text = if (isBoosterMode) "⚡ 부스터 풀파워 스캔 가동 중!" else "실시간 공간·벽면 스캔 가동 중! (폰을 위아래로 기울이면 층 구분이 정밀해집니다)"
                  statusTv.setTextColor(Color.parseColor("#4ADE80"))
                  restartBleScanner()
                  uiHandler.removeCallbacks(scanLoop)
                  uiHandler.post(scanLoop)
              }

              @SuppressLint("MissingPermission")
              private fun restartBleScanner() {
                  try {
                      val btMgr = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val scanner = btMgr.adapter?.bluetoothLeScanner ?: return
                      scanner.stopScan(bleCallback)

                      val builder = ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .setCallbackType(ScanSettings.CALLBACK_TYPE_ALL_MATCHES)

                      if (isBoosterMode) {
                          builder.setMatchMode(ScanSettings.MATCH_MODE_AGGRESSIVE)
                          builder.setNumOfMatches(ScanSettings.MATCH_NUM_MAX_ADVERTISEMENT)
                          builder.setReportDelay(0L)
                      }
                      scanner.startScan(null, builder.build(), bleCallback)
                      lastBleRestart = System.currentTimeMillis()
                  } catch (e: Exception) {
                      statusTv.text = "블루투스 및 위치(GPS) 권한과 스위치를 켜주세요."
                  }
              }

              private val bleCallback = object : ScanCallback() {
                  @SuppressLint("MissingPermission")
                  override fun onScanResult(callbackType: Int, result: ScanResult) {
                      val id = result.device.address ?: return
                      val rawName = result.device.name
                      val name = if (rawName.isNullOrBlank()) "BLE(${id.takeLast(5)})" else rawName
                      updateNode(id, name, "BLE", 2400, result.rssi)
                  }
              }

              @SuppressLint("MissingPermission")
              private val scanLoop = object : Runnable {
                  override fun run() {
                      if (!isScanning) return

                      val now = System.currentTimeMillis()
                      // 부스터 모드일 때는 안드로이드 스캔 쓰로틀링 방지를 위해 2.8초마다 BLE 스캐너 강제 재점화
                      if (isBoosterMode && now - lastBleRestart > 2800) {
                          restartBleScanner()
                      }

                      try {
                          val wifiMgr = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          wifiMgr.startScan()
                          for (w in wifiMgr.scanResults) {
                              val id = w.BSSID ?: continue
                              val ssid = if (w.SSID.isNullOrBlank()) "WiFi(${id.takeLast(5)})" else w.SSID
                              updateNode(id, ssid, "WIFI", w.frequency, w.level)
                          }
                      } catch (e: Exception) {}

                      val expireMs = if (isBoosterMode) 12000L else 8000L
                      nodes.entries.removeIf { now - it.value.lastSeen > expireMs }

                      val sorted = nodes.values.sortedBy { it.distance }
                      updateLeftScrollList(sorted)
                      radarView.updateData(sorted, myHeading, selectedNodeId)

                      val interval = if (isBoosterMode) 65L else 140L
                      uiHandler.postDelayed(this, interval)
                  }
              }

              private fun updateNode(id: String, label: String, type: String, freq: Int, newRssi: Int) {
                  val now = System.currentTimeMillis()
                  val dist = estimateDistance(newRssi, freq)
                  val existing = nodes[id]

                  if (existing == null) {
                      val hashAngle = ((id.hashCode() and 0x7FFFFFFF) % 360).toFloat()
                      val initialFloor = classifyFloor(newRssi, 1.5f, freq, 0f, id)
                      nodes[id] = RfNode(id, label, type, freq, newRssi, newRssi.toFloat(), 1.0f, dist, hashAngle, initialFloor, 0f, now)
                  } else {
                      val deltaRssi = newRssi - existing.smoothRssi
                      val diff = abs(deltaRssi)
                      existing.fluctuation = existing.fluctuation * 0.65f + diff * 0.35f
                      existing.smoothRssi = existing.smoothRssi * 0.72f + newRssi * 0.28f
                      existing.rssi = newRssi
                      existing.distance = estimateDistance(existing.smoothRssi.toInt(), freq)

                      // 폰을 위(천장, myPitch < -15)나 아래(바닥, myPitch > 15)로 기울일 때 신호 증감 상관관계 누적
                      if (abs(myPitch) > 12f) {
                          val pitchSign = if (myPitch < 0) 1f else -1f // 위를 향하면 +1, 아래를 향하면 -1
                          existing.pitchCorrelation = (existing.pitchCorrelation * 0.85f) + (deltaRssi * pitchSign * 0.15f)
                      }

                      existing.floor = classifyFloor(existing.smoothRssi.toInt(), existing.fluctuation, freq, existing.pitchCorrelation, id)
                      existing.lastSeen = now
                  }
              }

              // 층 구분 휴리스틱 알고리즘 (콘크리트 슬래브 감쇠 + 틸트 상관도 + 다중경로 특성)
              private fun classifyFloor(rssi: Int, fluct: Float, freq: Int, pitchCorr: Float, id: String): FloorLevel {
                  // 1. 사용자가 폰을 위/아래로 기울여 신호 변화가 뚜렷하게 잡힌 경우 우선 반영
                  if (pitchCorr > 1.2
