name: Build Wall Scanner APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate Standalone RF Wall Radar Project
        run: |
          rm -rf *
          mkdir -p app/src/main/java/com/icar/uwbradar

          cat << 'EOF' > gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          EOF

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "ICARWallRadar"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.2.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.22" apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.icar.uwbradar"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.icar.wallradar"
                  minSdk = 29
                  targetSdk = 34
                  versionCode = 2
                  versionName = "2.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation("androidx.core:core-ktx:1.12.0")
              implementation("androidx.appcompat:appcompat:1.6.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.BLUETOOTH" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" />
              <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" />

              <application
                  android:label="ICAR 공간전파 투과레이더"
                  android:theme="@style/Theme.AppCompat.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:screenOrientation="portrait">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/icar/uwbradar/MainActivity.kt
          package com.icar.uwbradar

          import android.Manifest
          import android.annotation.SuppressLint
          import android.bluetooth.BluetoothManager
          import android.bluetooth.le.ScanCallback
          import android.bluetooth.le.ScanResult
          import android.bluetooth.le.ScanSettings
          import android.content.Context
          import android.graphics.*
          import android.hardware.Sensor
          import android.hardware.SensorEvent
          import android.hardware.SensorEventListener
          import android.hardware.SensorManager
          import android.net.wifi.WifiManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.Looper
          import android.view.Gravity
          import android.view.View
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity
          import androidx.core.app.ActivityCompat
          import java.util.concurrent.ConcurrentHashMap
          import kotlin.math.*

          data class RfNode(
              val id: String,
              val label: String,
              val type: String, // "BLE" or "WIFI"
              var rssi: Int,
              var smoothRssi: Float,
              var fluctuation: Float, // 신호 요동치 (벽 너머 움직임 감지용)
              var distance: Float,
              val baseAngle: Float,
              var lastSeen: Long
          )

          class MainActivity : AppCompatActivity(), SensorEventListener {

              private val nodes = ConcurrentHashMap<String, RfNode>()
              private lateinit var radarView: SpaceRadarView
              private lateinit var statusTv: TextView
              private lateinit var summaryTv: TextView

              private lateinit var sensorManager: SensorManager
              private var myHeading = 0f
              private val accelReading = FloatArray(3)
              private val magReading = FloatArray(3)
              private val rotMatrix = FloatArray(9)
              private val orientAngles = FloatArray(3)

              private val uiHandler = Handler(Looper.getMainLooper())
              private var isScanning = false
              private var maxScaleMeters = 12f

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  sensorManager = getSystemService(Context.SENSOR_SERVICE) as SensorManager
                  setupUi()
                  requestPermissions()
              }

              private fun requestPermissions() {
                  val perms = mutableListOf(
                      Manifest.permission.ACCESS_FINE_LOCATION,
                      Manifest.permission.ACCESS_COARSE_LOCATION,
                      Manifest.permission.ACCESS_WIFI_STATE,
                      Manifest.permission.CHANGE_WIFI_STATE
                  )
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {
                      perms.add(Manifest.permission.BLUETOOTH_SCAN)
                      perms.add(Manifest.permission.BLUETOOTH_CONNECT)
                  }
                  if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.TIRAMISU) {
                      perms.add(Manifest.permission.NEARBY_WIFI_DEVICES)
                  }
                  ActivityCompat.requestPermissions(this, perms.toTypedArray(), 200)
              }

              private fun setupUi() {
                  val root = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setBackgroundColor(Color.parseColor("#070A0F"))
                      setPadding(36, 48, 36, 36)
                  }

                  val title = TextView(this).apply {
                      text = "ICAR 공간·벽너머 전파 투과 레이더"
                      setTextColor(Color.parseColor("#38BDF8"))
                      textSize = 19f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                  }

                  statusTv = TextView(this).apply {
                      text = "파란점: 고정 신호  |  빨간파동: 벽너머 신호 출렁임(움직임 감지)"
                      setTextColor(Color.parseColor("#94A3B8"))
                      textSize = 12f
                      gravity = Gravity.CENTER
                      setPadding(0, 10, 0, 20)
                  }

                  radarView = SpaceRadarView(this).apply {
                      layoutParams = LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, 0, 1f
                      )
                  }

                  summaryTv = TextView(this).apply {
                      text = "감지된 투과 신호: 0개  |  움직임(출렁임) 경보: 0건"
                      setTextColor(Color.WHITE)
                      textSize = 14f
                      typeface = Typeface.DEFAULT_BOLD
                      gravity = Gravity.CENTER
                      setPadding(16, 24, 16, 24)
                  }

                  val btnRow = LinearLayout(this).apply { orientation = LinearLayout.HORIZONTAL }

                  val btnStart = Button(this).apply {
                      text = "실시간 주변·벽너머 스캔 시작"
                      setBackgroundColor(Color.parseColor("#0284C7"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 135, 1.4f).apply { rightMargin = 16 }
                      setOnClickListener { startSpaceScan() }
                  }

                  val btnScale = Button(this).apply {
                      text = "반경: 12m"
                      setBackgroundColor(Color.parseColor("#1E293B"))
                      setTextColor(Color.WHITE)
                      layoutParams = LinearLayout.LayoutParams(0, 135, 0.8f)
                      setOnClickListener {
                          maxScaleMeters = when (maxScaleMeters) {
                              6f -> 12f
                              12f -> 25f
                              else -> 6f
                          }
                          text = "반경: ${maxScaleMeters.toInt()}m"
                          radarView.maxRange = maxScaleMeters
                      }
                  }

                  btnRow.addView(btnStart)
                  btnRow.addView(btnScale)

                  root.addView(title)
                  root.addView(statusTv)
                  root.addView(radarView)
                  root.addView(summaryTv)
                  root.addView(btnRow)

                  setContentView(root)
              }

              @SuppressLint("MissingPermission")
              private fun startSpaceScan() {
                  if (isScanning) return
                  isScanning = true
                  statusTv.text = "초고감도 전파 투과 스캔 가동 중! (폰을 천천히 돌려보세요)"
                  statusTv.setTextColor(Color.parseColor("#4ADE80"))

                  // 1. BLE 초고속 저지연 스캔
                  try {
                      val btManager = getSystemService(Context.BLUETOOTH_SERVICE) as BluetoothManager
                      val scanner = btManager.adapter?.bluetoothLeScanner
                      val settings = ScanSettings.Builder()
                          .setScanMode(ScanSettings.SCAN_MODE_LOW_LATENCY)
                          .build()
                      scanner?.startScan(null, settings, bleCallback)
                  } catch (e: Exception) {
                      statusTv.text = "블루투스 및 위치(GPS) 스위치를 켜고 권한을 허용해주세요."
                  }

                  // 2. Wi-Fi 전파 주기적 스캔 및 화면 갱신 루프
                  uiHandler.post(updateRunnable)
              }

              private val bleCallback = object : ScanCallback() {
                  @SuppressLint("MissingPermission")
                  override fun onScanResult(callbackType: Int, result: ScanResult) {
                      val id = result.device.address ?: return
                      val name = result.device.name ?: "신호원(${id.takeLast(5)})"
                      val rssi = result.rssi
                      updateNode(id, name, "BLE", rssi)
                  }
              }

              @SuppressLint("MissingPermission")
              private val updateRunnable = object : Runnable {
                  override fun run() {
                      if (!isScanning) return

                      try {
                          val wifiMgr = applicationContext.getSystemService(Context.WIFI_SERVICE) as WifiManager
                          wifiMgr.startScan()
                          for (w in wifiMgr.scanResults) {
                              val id = w.BSSID ?: continue
                              val ssid = if (w.SSID.isNullOrBlank()) "WiFi(${id.takeLast(5)})" else w.SSID
                              updateNode(id, ssid, "WIFI", w.level)
                          }
                      } catch (e: Exception) {}

                      // 오래된 신호 정리 (8초 이상 미수신 시 제거)
                      val now = System.currentTimeMillis()
                      nodes.entries.removeIf { now - it.value.lastSeen > 8000 }

                      val list = nodes.values.toList()
                      val movingCount = list.count { it.fluctuation >= 3.2f }
                      summaryTv.text = "벽·주변 감지 신호: ${list.size}개   |   신호 출렁임(움직임): ${movingCount}건"

                      radarView.updateData(list, myHeading)
                      uiHandler.postDelayed(this, 120)
                  }
              }

              private fun updateNode(id: String, label: String, type: String, newRssi: Int) {
                  val now = System.currentTimeMillis()
                  val dist = estimateDistance(newRssi)
                  val existing = nodes[id]

                  if (existing == null) {
                      // 고유 MAC 주소를 기반으로 공간 방향각 배치 + 나침반 회전 연동
                      val hashAngle = ((id.hashCode() and 0x7FFFFFFF) % 360).toFloat()
                      nodes[id] = RfNode(id, label, type, newRssi, newRssi.toFloat(), 0f, dist, hashAngle, now)
                  } else {
                      val diff = abs(newRssi - existing.smoothRssi)
                      existing.fluctuation = existing.fluctuation * 0.7f + diff * 0.3f
                      existing.smoothRssi = existing.smoothRssi * 0.75f + newRssi * 0.25f
                      existing.rssi = newRssi
                      existing.distance = estimateDistance(existing.smoothRssi.toInt())
                      existing.lastSeen = now
                  }
              }

              // 전파 감쇠 공식(Path-Loss)으로 벽 너머 거리(m) 산출
              private fun estimateDistance(rssi: Int): Float {
                  val txPower = -59.0
                  val n = 2.6 // 실내 및 벽 투과 환경 감쇠 지수
                  val d = 10.0.pow((txPower - rssi) / (10.0 * n)).toFloat()
                  return d.coerceIn(0.3f, 35.0f)
              }

              override fun onResume() {
                  super.onResume()
                  sensorManager.getDefaultSensor(Sensor.TYPE_ACCELEROMETER)?.also {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
                  sensorManager.getDefaultSensor(Sensor.TYPE_MAGNETIC_FIELD)?.also {
                      sensorManager.registerListener(this, it, SensorManager.SENSOR_DELAY_GAME)
                  }
              }

              override fun onPause() {
                  super.onPause()
                  sensorManager.unregisterListener(this)
              }

              override fun onSensorChanged(event: SensorEvent) {
                  if (event.sensor.type == Sensor.TYPE_ACCELEROMETER) {
                      System.arraycopy(event.values, 0, accelReading, 0, accelReading.size)
                  } else if (event.sensor.type == Sensor.TYPE_MAGNETIC_FIELD) {
                      System.arraycopy(event.values, 0, magReading, 0, magReading.size)
                  }
                  if (SensorManager.getRotationMatrix(rotMatrix, null, accelReading, magReading)) {
                      SensorManager.getOrientation(rotMatrix, orientAngles)
                      val deg = (Math.toDegrees(orientAngles[0].toDouble()).toFloat() + 360f) % 360f
                      myHeading = deg
                  }
              }

              override fun onAccuracyChanged(sensor: Sensor?, accuracy: Int) {}
          }

          class SpaceRadarView(context: Context) : View(context) {
              var maxRange = 12f
              private var nodeList = emptyList<RfNode>()
              private var heading = 0f
              private var sweepAngle = 0f

              private val ringPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#1E293B")
                  style = Paint.Style.STROKE
                  strokeWidth = 3f
              }
              private val textPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#CBD5E1")
                  textSize = 26f
                  typeface = Typeface.DEFAULT_BOLD
              }
              private val subTextPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#64748B")
                  textSize = 22f
              }
              private val staticPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#38BDF8")
                  style = Paint.Style.FILL
              }
              private val alertPaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#EF4444")
                  style = Paint.Style.FILL
              }
              private val wavePaint = Paint(Paint.ANTI_ALIAS_FLAG).apply {
                  color = Color.parseColor("#F87171")
                  style = Paint.Style.STROKE
                  strokeWidth = 5f
              }

              fun updateData(list: List<RfNode>, currentHeading: Float) {
                  nodeList = list.sortedBy { it.distance }
                  heading = currentHeading
                  sweepAngle = (sweepAngle + 6f) % 360f
                  invalidate()
              }

              override fun onDraw(canvas: Canvas) {
                  super.onDraw(canvas)
                  val cx = width / 2f
                  val cy = height / 2f
                  val maxR = min(width, height) * 0.44f

                  // 거리 가이드 링 (25%, 50%, 75%, 100%)
                  listOf(0.25f, 0.5f, 0.75f, 1.0f).forEach { r ->
                      val radPx = maxR * r
                      canvas.drawCircle(cx, cy, radPx, ringPaint)
                      canvas.drawText("${(maxRange * r).toInt()}m", cx + 10f, cy - radPx + 24f, subTextPaint)
                  }

                  // 십자선
                  canvas.drawLine(cx - maxR, cy, cx + maxR, cy, ringPaint)
                  canvas.drawLine(cx, cy - maxR, cx, cy + maxR, ringPaint)

                  // 중앙 내 폰 위치
                  canvas.drawCircle(cx, cy, 14f, Paint().apply { color = Color.WHITE })

                  // 감지된 벽 너머 및 주변 전파 신호원 렌더링
                  for (node in nodeList) {
                      val normD = (node.distance / maxRange).coerceIn(0.08f, 1.0f)
                      val rPx = normD * maxR
                      val relAngle = (node.baseAngle - heading + 360f) % 360f
                      val rad = Math.toRadians(relAngle.toDouble())

                      val tx = cx + (rPx * sin(rad)).toFloat()
                      val ty = cy - (rPx * cos(rad)).toFloat()

                      // 신호가 크게 출렁이면(사람 이동/간섭) 빨간색 파동, 고정되어 있으면 파란색
                      val isMoving = node.fluctuation >= 3.2f
                      if (isMoving) {
                          canvas.drawCircle(tx, ty, 38f + node.fluctuation * 4f, wavePaint)
                          canvas.drawCircle(tx, ty, 20f, alertPaint)
                      } else {
                          canvas.drawCircle(tx, ty, 15f, staticPaint)
                      }

                      canvas.drawText(
                          "${node.label.take(10)} (${String.format("%.1f", node.distance)}m)",
                          tx + 22f,
                          ty + 8f,
                          textPaint
                      )
                  }
              }
          }
          EOF

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ICAR-Wall-Scanner-APK
          path: app/build/outputs/apk/debug/app-debug.apk
